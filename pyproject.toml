[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gerdiary-api"
version = "0.1.0"
description = "Gerdiary HTTP API"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "Flask>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.13,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-Flask-Migrate>=4.1,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gerdiary"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gerdiary"]
